[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thousandproblems"
version = "0.2.0"
description = "Fast parser and printer for the TPTP problem and solution syntax (thf, tff, tcf, fof, cnf, tpi)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ontology Portal", email = "pypi@ontologyportal.org" }]
keywords = ["tptp", "parser", "theorem proving", "automated reasoning", "logic", "first-order logic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
[project.scripts]
thousandproblems = "thousandproblems.cli:main"

[project.urls]
Home = "https://ontologyportal.org"
Source = "https://github.com/ontologyportal/thousandproblems"
Issues = "https://github.com/ontologyportal/thousandproblems/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["thousandproblems"]
include-package-data = false

[tool.setuptools.package-data]
thousandproblems = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_i686 *-manylinux_i686"
build-verbosity = 1
# The checks that the C parser really is in the wheel are in the test suite
# (tests/test_backends.py), which is switched on by THOUSANDPROBLEMS_REQUIRE_EXT.
test-command = "python -m unittest discover -s {project}/tests"

[tool.cibuildwheel.environment]
THOUSANDPROBLEMS_REQUIRE_EXT = "1"

# Each runner builds its own architecture only (the release workflow has an x86_64 and an
# arm64 runner for Linux and for macOS). Asking for another architecture would need QEMU
# on Linux, and would build duplicate wheels on macOS.
[tool.cibuildwheel.windows]
archs = ["AMD64"]
