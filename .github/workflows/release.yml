name: release

# Publishing happens when a GitHub release is published. To rehearse, run this workflow
# by hand ("Run workflow"): it builds everything and uploads to TestPyPI instead.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      # A pure-Python wheel, so platforms without a binary wheel install quickly
      # instead of compiling, and still work if they cannot compile.
      - run: python -m build --wheel
        env:
          THOUSANDPROBLEMS_PURE_PYTHON: "1"
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pure
          path: dist/*

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
        # Build options, and the test that each wheel really contains the C parser,
        # are in pyproject.toml under [tool.cibuildwheel].
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi            # create this environment in the repo settings
    permissions:
      id-token: write            # trusted publishing: no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Publish to TestPyPI (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI (releases)
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@v1.14.3
