name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install, building the C extension (a failed compile fails the job)
        run: python -m pip install .
        env:
          THOUSANDPROBLEMS_REQUIRE_EXT: "1"
      - name: The C parser is the one in use
        run: python -c "import thousandproblems; assert thousandproblems.BACKEND == 'c', thousandproblems.BACKEND"
      - name: Test (C parser)
        run: python -m unittest discover -s tests
        env:
          THOUSANDPROBLEMS_FUZZ_ROUNDS: "1000"
      - name: Test (pure-Python parser)
        run: python -m unittest discover -s tests
        env:
          THOUSANDPROBLEMS_PURE_PYTHON: "1"
